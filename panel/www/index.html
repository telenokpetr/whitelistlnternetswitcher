<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Моё время · Дед Обход</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/icon-64.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">

<style>
:root{--bg:#0a1220;--tx:#F2F4F8;--mut:#93a1b8;--line:#1d2e4d;--ok:#35e08a;--bad:#ff5a4f}
body{margin:0;min-height:100vh;display:grid;place-items:center;color:var(--tx);font:16px system-ui,sans-serif;text-align:center;padding:16px;
     background:var(--bg) url(assets/hero.jpg) center top/cover fixed no-repeat}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(10,18,32,.55),rgba(10,18,32,.9));z-index:0}
body>div{position:relative;z-index:1;background:linear-gradient(180deg,#f2e4cb,#e6d4b3);color:#17130d;border-radius:22px;padding:22px 26px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:360px;width:100%}
.ic{width:64px;height:64px;border-radius:50%;border:3px solid #fff7e8;display:block;margin:-54px auto 10px;box-shadow:0 4px 16px rgba(0,0,0,.45)}
.t{font-size:48px;font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:10px;background:rgba(0,0,0,.12);overflow:hidden;margin:14px auto}
.bar i{display:block;height:100%;background:#16a34a}
.mut{color:#6a5f4c}
</style>
</head>
<body>
<div>
  <img class="ic" src="assets/icon-192.png" alt="">
  <div class="mut" id="who"></div>
  <div class="t" id="t">…</div>
  <div class="bar"><i id="b" style="width:0"></i></div>
  <div class="mut" id="s"></div>
</div>
<script>
let rem=0,run=false,at=0,lim=1;
const fmt=s=>{s=Math.max(0,Math.floor(s));return Math.floor(s/3600)+':'+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
async function load(){
  try{const d=await (await fetch('/cgi-bin/timer')).json();
    if(!d.limited){document.getElementById('t').textContent='Без ограничений';document.getElementById('s').textContent='';run=false;return;}
    rem=d.remaining_s;run=d.active&&rem>0;at=Date.now();lim=d.limit_s||1;
    document.getElementById('who').textContent=d.name||'';
  }catch(e){}
}
function draw(){
  if(lim<=1&&rem===0&&!at)return;
  const left=run?rem-(Date.now()-at)/1000:rem;
  const el=document.getElementById('t');
  if(at){el.textContent=left<=0?'Время вышло':fmt(left);document.getElementById('b').style.width=Math.max(0,Math.min(100,left/lim*100))+'%';
    document.getElementById('s').textContent=left<=0?'Лимит на эту неделю закончился':(run?'Идёт отсчёт — вы в сети':'Нет трафика — время не тратится');}
}
load();setInterval(load,8000);setInterval(draw,1000);
</script>
</body>
</html>
