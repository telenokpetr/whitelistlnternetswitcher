<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Моё время</title>
<style>
:root{--bg:#f4f5f7;--tx:#1b1f24;--mut:#6b7280;--line:#e5e7eb;--ok:#16a34a;--bad:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--tx:#e8eaed;--mut:#98a0ab;--line:#2a2f38;--ok:#34d399;--bad:#f87171}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;text-align:center;padding:16px}
.t{font-size:56px;font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:10px;background:var(--line);overflow:hidden;margin:14px auto;max-width:320px}
.bar i{display:block;height:100%;background:var(--ok)}
.mut{color:var(--mut)}
</style>
</head>
<body>
<div>
  <div class="mut" id="who"></div>
  <div class="t" id="t">…</div>
  <div class="bar"><i id="b" style="width:0"></i></div>
  <div class="mut" id="s"></div>
</div>
<script>
let rem=0,run=false,at=0,lim=1;
const fmt=s=>{s=Math.max(0,Math.floor(s));return Math.floor(s/3600)+':'+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
async function load(){
  try{const d=await (await fetch('/cgi-bin/timer')).json();
    if(!d.limited){document.getElementById('t').textContent='Без ограничений';document.getElementById('s').textContent='';run=false;return;}
    rem=d.remaining_s;run=d.active&&rem>0;at=Date.now();lim=d.limit_s||1;
    document.getElementById('who').textContent=d.name||'';
  }catch(e){}
}
function draw(){
  if(lim<=1&&rem===0&&!at)return;
  const left=run?rem-(Date.now()-at)/1000:rem;
  const el=document.getElementById('t');
  if(at){el.textContent=left<=0?'Время вышло':fmt(left);document.getElementById('b').style.width=Math.max(0,Math.min(100,left/lim*100))+'%';
    document.getElementById('s').textContent=left<=0?'Лимит на эту неделю закончился':(run?'Идёт отсчёт — вы в сети':'Нет трафика — время не тратится');}
}
load();setInterval(load,8000);setInterval(draw,1000);
</script>
</body>
</html>
