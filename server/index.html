<div class="wrap">

<script>
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
const WEB = !tg.initData;
try { tg.setHeaderColor('#0a1220'); tg.setBackgroundColor('#070c16'); } catch (e) {}
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function call(action, extra) {
  const r = await fetch(location.pathname, {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(Object.assign({action, initData: tg.initData}, extra||{}))});
  return r.json();
}
function copy(text, btn) {
  navigator.clipboard.writeText(text).then(()=>{const t=btn.textContent; btn.textContent='Скопировано'; setTimeout(()=>btn.textContent=t,1500)});
}
function clientCard(c) {
  return `<div class="card cream ${c.enable?'':'off'}"><b>${esc(c.email)}</b>
    <div class="row"><span>Трафик</span><span>${esc(c.used)} / ${esc(c.limit)}</span></div>
    <div class="row"><span>Срок</span><span>${esc(c.expire)}</span></div>
    <div class="link">${esc(c.link)}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="sec small" onclick="copy('${esc(c.link)}',this)">Копировать ссылку</button>
    <button class="sec small" onclick="toggleQr(this,'${esc(c.link)}')">QR-код</button>
    ${c.days_left !== null && c.days_left !== undefined && c.days_left <= 10 ? `<button class="small" onclick="renew('${esc(c.email)}',this)">Продлить на месяц</button>` : ''}</div><div class="qrwrap"></div></div>`;
}

function osGuideCard(os, open) {
  const g = OS_GUIDE[os]; if (!g) return '';
  return `<details ${open ? 'open' : ''}><summary>${esc(os)}${open ? ' · ваше устройство' : ''}</summary>
    <p>Приложения: ${g.apps.map(a => `<span class="pill">${esc(a)}</span>`).join('')}</p>
    <ol>${g.steps.map(x => `<li>${esc(x)}</li>`).join('')}</ol>
    ${g.tips.map(t => `<div class="tip">${esc(t)}</div>`).join('')}</details>`;
}
function osGuides() {
  const mine = me.profile && me.profile.os;
  const others = Object.keys(OS_GUIDE).filter(o => o !== mine);
  return (mine ? osGuideCard(mine, true) : '') +
    (mine ? '<div class="muted" style="margin:10px 2px 6px">Другие устройства</div>' : '') +
    others.map(o => osGuideCard(o, !mine && o === others[0])).join('');
}

const helpHtml = () => `
<h2>Быстрый старт</h2>

<details><summary>Общая схема подключения</summary>

<h2>Какой профиль выбрать</h2>
<details><summary>Обход блокировок 1 и 2</summary>
<p>Идут через российские CDN. Это основной вариант, когда мобильный интернет работает по белым спискам: снаружи соединение выглядит как обычный запрос к CDN.</p>
<ul><li>Сначала пробуйте «Обход блокировок 1».</li><li>Если не подключается или медленно, переключитесь на «Обход блокировок 2».</li><li>Скорость ниже, чем у прямых профилей, это нормально.</li></ul>

<li>Не оставляйте приложение в режиме экономии батареи: система может усыплять VPN.</li>

<p class="muted" style="margin-top:14px">Нужна помощь: <b>${esc(me.support)}</b>. Ваш Telegram ID: <b>${esc(me.id)}</b></p>`;


function proxyCard(p, admin) {
  return `<div class="card ${p.enable?'':'off'}"><b>${esc(p.name)}</b><span class="badge">:${p.port}</span>
    <div class="row"><span>Сервер</span><span>${esc(p.host)}:${p.port}</span></div>
    <div class="row"><span>Логин</span><span>${esc(p.user)}</span></div>
    <div class="row"><span>Пароль</span><span>${esc(p.pass)}</span></div>
    <div class="link">${esc(p.link)}</div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="small" onclick="tg.openTelegramLink('${esc(p.link)}')">Добавить в Telegram</button>
      <button class="sec small" onclick="copy('${esc(p.link)}',this)">Копировать</button>
      ${admin ? `<button class="sec small" onclick="toggleProxy(${p.port},${p.enable})">${p.enable?'Отключить':'Включить'}</button>` : ''}
    </div></div>`;
}
async function toggleProxy(port, on) { await call(on ? 'proxy_disable' : 'proxy_enable', {port}); setTab('proxy'); }
async function renderProxy(p) {
  const r = await call('proxies');
  if (r.error) { p.innerHTML = `<div class="err">${esc(r.error)}</div>`; return; }
  const list = r.proxies || [];
  const lim = me.proxy_limit;
  const can = lim === null || list.length < lim;
  p.innerHTML = '<h2>Прокси для Telegram (SOCKS5)</h2>' +
    (list.length ? list.map(x => proxyCard(x, me.admin)).join('') : '<div class="card">Прокси ещё нет.</div>') +
    (can ? `<div class="card"><input id="plabel" placeholder="Название (необязательно, латиницей)"><button id="pmk">Создать прокси</button><div id="pmsg"></div></div>`
         : `<p class="muted">Лимит исчерпан (${lim}). Нужен ещё прокси: обратитесь к администратору.</p>`) +
    `<p class="muted">Прокси работают с логином и паролем. Не делитесь ссылкой: она личная. При белых списках оператора могут не открываться: тогда используйте профили «Обход блокировок».</p>`;
  const mk = document.getElementById('pmk');
  if (mk) mk.onclick = async () => {
    mk.disabled = true;
    const res = await call('proxy_create', {label: document.getElementById('plabel').value.trim()});
    if (res.error) { document.getElementById('pmsg').innerHTML = `<div class="err">${esc(res.error)}</div>`; mk.disabled = false; }
    else renderProxy(p);
  };
}

    <button class="sec small" onclick="copy('${esc(me.ton)}',this)">Копировать адрес</button></div>
    <div class="link">${esc(me.ton)}</div>` : '';
  return `<h2>Поддержать деда</h2><div class="card"><div class="muted" style="margin-bottom:8px">Проект некоммерческий, донат добровольный. Спасибо!</div>
    <div class="muted" style="margin-bottom:6px">Telegram Stars</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${stars}</div>
    <div style="display:flex;gap:8px;margin-top:8px"><input id="dstars" type="number" inputmode="numeric" placeholder="Своя сумма в ⭐" style="margin-top:0"><button class="small" style="white-space:nowrap" onclick="donate(Number(document.getElementById('dstars').value))">Отправить</button></div>
    ${ton}<div id="dmsg"></div></div>`;
}
async function donate(n) {
  const r = await call('donate_link', {amount: n});
  if (r.error) { document.getElementById('dmsg').innerHTML = `<div class="err">${esc(r.error)}</div>`; return; }
  try { tg.openInvoice(r.link, st => { if (st === 'paid') document.getElementById('dmsg').innerHTML = '<div class="tip">Спасибо! Дед благодарит.</div>'; }); }
  catch (e) { window.open(r.link, '_blank'); }
}
function donateTon(n) {
  tg.openLink('https://app.tonkeeper.com/transfer/' + me.ton + '?amount=' + Math.round(n * 1e9) + '&text=' + encodeURIComponent('Дед VPN'));
}

const OS_ICON = {iOS:'', Android:'', Windows:'', macOS:'', Linux:'', 'Роутер':''};
const OS_APPS = {iOS:'Happ, Hiddify, v2rayTun', Android:'Happ, Hiddify, v2rayNG', Windows:'Happ, Hiddify, v2rayN', macOS:'Happ, Hiddify', Linux:'Hiddify, v2rayN', 'Роутер':'Xray (OpenWrt: Passwall, Xray)'};
function onboarding() {
  app.innerHTML = `<h2>Знакомство</h2><div class="card">
    <div class="muted" style="margin-bottom:8px">Как вас называть и какое у вас устройство? Это нужно, чтобы подсказать подходящее приложение.</div>
    <input id="pname" placeholder="Ваше имя" maxlength="40" value="${esc((tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name) || '')}">
    <div class="muted" style="margin:12px 0 6px">Операционная система</div>
    <div id="pos" style="display:flex;gap:8px;flex-wrap:wrap">${me.os_list.map(o => `<button class="sec small" data-os="${esc(o)}">${esc(o)}</button>`).join('')}</div>
    <button id="psave">Продолжить</button><div id="pmsg2"></div></div>`;
  let chosen = '';
  document.querySelectorAll('#pos button').forEach(b => b.onclick = () => {
    chosen = b.dataset.os;
    document.querySelectorAll('#pos button').forEach(x => { x.classList.toggle('sec', x !== b); });
  });
  document.getElementById('psave').onclick = async () => {
    const r = await call('profile_set', {name: document.getElementById('pname').value.trim(), os: chosen});
    if (r.error) document.getElementById('pmsg2').innerHTML = `<div class="err">${esc(r.error)}</div>`;
    else render();
  };
}

function toggleQr(btn, link) {
  const box = btn.closest('.card').querySelector('.qrwrap');
  if (box.innerHTML) { box.innerHTML = ''; return; }
  const q = qrcode(0, 'M'); q.addData(link); q.make();
  box.innerHTML = q.createSvgTag({cellSize: 4, margin: 0, scalable: true}) + '<div class="muted qrnote">Отсканируйте в приложении: «Добавить подписку» → QR</div>';
}
async function renew(email, btn) {
  btn.disabled = true;
  const r = await call('renew', {email});
  if (r.error) { btn.disabled = false; alert(r.error); } else render();
}
async function logout() { await call('web_logout'); render(); }
function loginScreen() {
  document.getElementById('title').textContent = 'Личный кабинет';
  document.getElementById('subtitle').textContent = 'Войдите, чтобы увидеть свою подписку';
  app.innerHTML = `<h2>Вход</h2><div class="card">
    <button id="ltg">Войти через Telegram</button><div id="lmsg" class="muted" style="margin-top:8px"></div></div>
    <div class="card"><div class="muted" style="margin-bottom:6px">Или по почте (адрес должен быть привязан в приложении)</div>
    <input id="lem" type="email" placeholder="E-mail" autocomplete="email">
    <button id="lreq" class="sec">Получить код</button>
    <div id="lcode" style="display:none"><input id="lc" inputmode="numeric" placeholder="Код из письма" maxlength="6"><button id="lgo">Войти</button></div>
    <div id="lemsg" class="muted" style="margin-top:8px"></div></div>`;
  const msg = document.getElementById('lmsg'), emsg = document.getElementById('lemsg');
  document.getElementById('ltg').onclick = async () => {
    const r = await call('web_tg_start');
    window.open(r.link, '_blank');
    msg.textContent = 'Подтвердите вход в Telegram, затем вернитесь сюда…';
    const iv = setInterval(async () => {
      const p = await call('web_tg_poll', {token: r.token});
      if (p.ok) { clearInterval(iv); render(); }
      else if (p.error) { clearInterval(iv); msg.textContent = p.error; }
    }, 2000);
  };
  document.getElementById('lreq').onclick = async () => {
    const r = await call('web_email_request', {email: document.getElementById('lem').value.trim()});
    if (r.error) { emsg.textContent = r.error; return; }
    emsg.textContent = 'Если адрес привязан, мы отправили код. Он действует 10 минут.';
    document.getElementById('lcode').style.display = 'block';
  };
  document.getElementById('lgo').onclick = async () => {
    const r = await call('web_email_verify', {email: document.getElementById('lem').value.trim(), code: document.getElementById('lc').value.trim()});
    if (r.ok) render(); else emsg.textContent = r.error || 'Ошибка';
  };
}
function emailCard() {
  return `<h2>Вход в кабинет</h2><div class="card"><div class="muted" style="margin-bottom:6px">Почта для входа на сайте (необязательно)</div>
    <input id="lemail" type="email" placeholder="E-mail" value="${esc(me.login_email || '')}">
    <button id="lesave" class="sec">Сохранить</button><div id="lemsg2" class="muted" style="margin-top:6px"></div>
    ${WEB ? '<button class="sec" onclick="logout()">Выйти</button>' : ''}</div>`;
}

let me = null, tab = 'mine';
async function render() {
  me = await call('me');
  if (me.error && WEB) { loginScreen(); return; }
  if (me.error) { app.innerHTML = `<div class="err">${esc(me.error)}</div>`; return; }
  document.getElementById('title').innerHTML = 'Привет, ' + esc(me.name) + (me.admin ? '<span class="badge">админ</span>' : '');
  if (!me.allowed) {
    app.innerHTML = `<div class="card">Доступа пока нет.<br>Ваш ID: <b>${esc(me.id)}</b><br><span class="muted">Передайте его администратору.</span></div>`;
    return;
  }
  if (!me.profile) { onboarding(); return; }
  let html = '';
  const ic = {
    mine:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
    proxy:'<path d="M3 11l18-8-8 18-2-8z"/>',
    help:'<path d="M4 5a2 2 0 012-2h13v15H6a2 2 0 00-2 2z"/><path d="M6 20h13"/>',
    clients:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-4 3-6 6.5-6s6.5 2 6.5 6M16 5a3.5 3.5 0 010 7M18 14c2.5.6 3.5 2.6 3.5 6"/>',
    users:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>'};
  const tb = (id, label) => `<button class="${tab===id?'on':''}" onclick="setTab('${id}')"><svg viewBox="0 0 24 24">${ic[id]}</svg>${label}</button>`;
  html += `<div class="tabs">${tb('mine','Подписка')}${tb('proxy','Прокси')}${tb('help','Инструкция')}` +
    (me.admin ? tb('clients','Клиенты') + tb('users','Доступ') : '') + `</div>`;
  const warn = (me.down && me.down.length)
    ? `<div class="warn">⚠️ Сейчас недоступно: ${me.down.map(esc).join(', ')}. Используйте другой профиль. Если проблема не уходит, напишите <a href="#" onclick="tg.openTelegramLink('https://t.me/${esc(me.support.replace('@',''))}');return false">${esc(me.support)}</a>.</div>` : '';
  app.innerHTML = warn + html + '<div id="pane"></div>';
  await pane();
}
async function setTab(t){ tab = t; await render(); }
async function pane() {
  const p = document.getElementById('pane');
  if (tab === 'proxy') { await renderProxy(p); }
  else if (tab === 'help') { p.innerHTML = helpHtml(); }
  else if (tab === 'mine') {
    const list = me.clients || [];
    const used = list.length, lim = me.limit;
    const canMake = lim === null || used < lim;
    p.innerHTML = (list.length ? `<h2>Ваши подписки${lim === null ? '' : ` · ${used} из ${lim}`}</h2>` + list.map(clientCard).join('') :
        `<div class="card">У вас ещё нет подписки.</div>`) +
      (me.profile ? `<div class="tip">Для ${esc(me.profile.os)}: ${esc(OS_APPS[me.profile.os] || '')}</div>` : '') + (canMake ? `<div class="tip">Подписка действует 30 дней, затем удаляется. Новую можно создать в любой момент.</div><button id="mk">${list.length ? 'Создать ещё одну подписку' : 'Создать мою подписку'}</button>` :
        `<p class="muted">Лимит подписок исчерпан. Лишнюю можно заменить через администратора.</p>`) + '<div id="msg"></div>' + emailCard() + donateHtml();
    document.getElementById('lesave').onclick = async () => {
      const r = await call('email_set', {email: document.getElementById('lemail').value.trim()});
      document.getElementById('lemsg2').textContent = r.error || 'Сохранено';
    };
    const mk = document.getElementById('mk');
    if (mk) mk.onclick = async () => {
      mk.disabled = true;
      const r = await call('create_self');
      if (r.error) { document.getElementById('msg').innerHTML = `<div class="err">${esc(r.error)}</div>`; mk.disabled = false; }
      else render();
    };
  } else if (tab === 'clients') {
    p.innerHTML = `<h2>Новая подписка</h2><div class="card">
      <input id="nm" placeholder="Имя (латиницей, напр. ivan)">
      <input id="gb" type="number" placeholder="Лимит ГБ (пусто = без лимита)">
      <input id="dy" type="number" placeholder="${me.owner ? 'Срок, дней (пусто = 30, 0 = без срока)' : 'Срок, дней (пусто = 30, максимум ' + me.max_days + ')'}">
      <button id="mk">Создать</button><div id="msg"></div></div><h2>Все клиенты</h2><div id="list" class="muted">Загрузка…</div>`;
    document.getElementById('mk').onclick = async () => {
      const r = await call('create_client', {name: nm.value.trim(), gb: gb.value, days: dy.value});
      if (r.error) document.getElementById('msg').innerHTML = `<div class="err">${esc(r.error)}</div>`;
      else { document.getElementById('msg').innerHTML = clientCard(r.client); loadClients(); }
    };
    loadClients();
  } else if (tab === 'users') {
    p.innerHTML = `<h2>Разрешить доступ</h2><div class="card">
      <input id="uid" inputmode="numeric" placeholder="Telegram ID человека">
      <input id="note" placeholder="Имя">
      <select id="uos" style="width:100%;margin-top:8px;padding:12px;border-radius:14px;background:#0a1426;color:var(--text);border:1px solid var(--line-2);font:400 15px var(--font)"><option value="">Операционная система</option>${me.os_list.map(o => `<option>${esc(o)}</option>`).join("")}</select>
      <button id="add">Добавить</button><div id="msg"></div></div>
      <p class="muted">Человек узнаёт свой ID, написав боту /start.</p><h2>Разрешённые</h2><div id="ul" class="muted">Загрузка…</div>`;
    document.getElementById('add').onclick = async () => {
      const r = await call('add_user', {id: uid.value.trim(), note: note.value.trim(), os: uos.value});
      if (r.error) document.getElementById('msg').innerHTML = `<div class="err">${esc(r.error)}</div>`;
      else { uid.value=''; note.value=''; loadUsers(); }
    };
    loadUsers();
  }
}
async function loadClients() {
  const r = await call('list_clients'); const el = document.getElementById('list'); if (!el) return;
  if (r.error) { el.innerHTML = `<div class="err">${esc(r.error)}</div>`; return; }
  el.className = '';
  el.innerHTML = r.clients.map(c => clientCard(c) +
    `<button class="sec small" style="margin:-4px 0 12px" onclick="toggle('${esc(c.email)}',${c.enable})">${c.enable?'Отключить':'Включить'}</button>`).join('')
    || '<div class="muted">Пока никого нет</div>';
}
async function toggle(email, on) {
  await call(on ? 'disable_client' : 'enable_client', {email}); loadClients();
}
async function loadUsers() {
  const r = await call('list_users'); const el = document.getElementById('ul'); if (!el) return;
  el.className = '';
  el.innerHTML = (r.users||[]).map(u => `<div class="card"><b>${esc(u.id)}</b> ${esc((u.profile && u.profile.name) || u.note || '')} <span class="pill">${esc((u.profile && u.profile.os) || '—')}</span>${u.role === 'admin' ? ' <span class="badge">админ</span>' : ''}
    <div class="row"><span>Подписка</span><span>${esc(u.email||'ещё не создана')}</span></div>
    <button class="sec small" style="margin-top:8px" onclick="rm('${esc(u.id)}')">Убрать доступ</button>
    ${me.owner ? `<button class="sec small" style="margin:8px 0 0 6px" onclick="setRole('${esc(u.id)}','${u.role === 'admin' ? '' : 'admin'}')">${u.role === 'admin' ? 'Снять админа' : 'Сделать админом'}</button>` : ''}</div>`).join('')
    || '<div class="muted">Список пуст</div>';
}
async function setRole(id, role) {
  const r = await call('set_role', {id, role});
  if (r.error) alert(r.error); else loadUsers();
}
async function rm(id) { await call('remove_user', {id}); loadUsers(); }
render();
</script>
</body>
</html>
